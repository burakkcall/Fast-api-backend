<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FastAPI Token Testi</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
        .box { background: #2d2d2d; padding: 15px; border-radius: 6px; max-width: 350px; margin-bottom: 15px; }
        input, button { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #007acc; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        pre { background: #000; padding: 10px; border-radius: 6px; color: #0f0; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>JWT API Test Arayüzü</h2>
    <div class="box">
        <h3>1. Giriş Yap</h3>
        <input type="text" id="username" placeholder="Kullanıcı Adı">
        <input type="password" id="password" placeholder="Şifre">
        <button onclick="login()">Giriş Yap</button>
    </div>
    <div class="box">
        <h3>2. Korumalı Alana İstek At</h3>
        <button onclick="getProtectedData()">Veri Çek</button>
    </div>
    <pre id="output">Sistem hazır...</pre>
    <script>
        const API_URL = "http://127.0.0.1:8000";
        async function login() {
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);
            try {
                const res = await fetch(`${API_URL}/login`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formData });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    document.getElementById('output').innerText = "✅ Giriş Başarılı!\n" + JSON.stringify(data, null, 2);
                } else document.getElementById('output').innerText = "❌ Hata:\n" + JSON.stringify(data, null, 2);
            } catch (err) { document.getElementById('output').innerText = "Hata: " + err; }
        }
        async function getProtectedData() {
            const token = localStorage.getItem('access_token');
            if (!token) return alert("Önce giriş yapın!");
            try {
                const res = await fetch(`${API_URL}/`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                document.getElementById('output').innerText = res.ok ? "✅ Başarılı!\n" + JSON.stringify(data, null, 2) : "❌ Yetkisiz!";
            } catch (err) { document.getElementById('output').innerText = "Hata: " + err; }
        }
    </script>
</body>
</html>
